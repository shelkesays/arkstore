[package]
name = "arkstore"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Backup, restore, retention-cleanup, and cold-tier archival for databases and files to object storage."
repository = "https://github.com/shelkesays/arkstore"
authors = ["Rahul Shelke"]
readme = "README.md"
keywords = ["backup", "restore", "archive", "s3", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[features]
# A sensible default build: Postgres + file sources + Parquet archival.
default = ["postgres", "archive", "files"]
# Engine drivers become optional dependencies behind these features as each
# backend lands (M0-3: tokio-postgres; M3: mysql_async, mongodb).
postgres = []
mysql = []
mongo = []
archive = []
files = []
# Everything compiled in — the primary release build.
full = ["postgres", "mysql", "mongo", "archive", "files"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
