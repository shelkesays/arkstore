[package]
name = "arkstore"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Backup, restore, retention-cleanup, and cold-tier archival for databases and files to object storage."
repository = "https://github.com/shelkesays/arkstore"
authors = ["Rahul Shelke"]
readme = "README.md"
keywords = ["backup", "restore", "archive", "s3", "database"]
categories = ["command-line-utilities", "database"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
# M0-2: object store, packaging, safe extraction, disk headroom.
bytes = "1"
flate2 = "1"
fs4 = { version = "1", features = ["sync"] }
futures = "0.3"
# S3 over reqwest + rustls with the `ring` crypto provider. object_store's own
# `aws` feature hard-wires aws-lc-rs (C, cmake); this trio avoids it:
#   object_store: aws-base + reqwest + ring
#   reqwest:      rustls-no-provider   (rustls without a bundled provider)
#   rustls:       ring                 (installed as the process default in main)
object_store = { version = "0.14", features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tar = "0.4"
tempfile = "3"

[package.metadata.cargo-machete]
# reqwest is a direct dependency only to select its `rustls-no-provider`
# feature for object_store's HTTP client; the code never names it.
ignored = ["reqwest"]

[dev-dependencies]

[features]
# A sensible default build: Postgres + file sources + Parquet archival.
default = ["postgres", "archive", "files"]
# Engine drivers become optional dependencies behind these features as each
# backend lands (M0-3: tokio-postgres; M3: mysql_async, mongodb).
postgres = []
mysql = []
mongo = []
archive = []
files = []
# Everything compiled in — the primary release build.
full = ["postgres", "mysql", "mongo", "archive", "files"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
