# SafeLint configuration for Arkstore.
#
# SafeLint v2.x ships the Rust-specific rules DISABLED by default, so relying on
# defaults would leave the Rust safety guardrails off. This file therefore
# EXPLICITLY enables every Rust-applicable rule (version-independent), on top of
# the always-on cross-language structural rules (function_length, nesting_depth,
# max_arguments, complexity, no_recursion, unbounded_loops, side_effects*), which
# run at their defaults.

fail_on = "error"

# ── Rust-only safety rules (all disabled by default upstream) ────────────────────
[rules.panic_macros_outside_tests] # SAFE204 — panic!/todo!/unimplemented! in prod
enabled = true
severity = "error"

[rules.result_unwrap_outside_tests] # SAFE208 — .unwrap()/.expect() outside tests
enabled = true
severity = "error"

[rules.lock_poisoning_ignored] # SAFE205 — mutex/rwlock .lock().unwrap()
enabled = true
severity = "error"

[rules.silent_result_discard] # SAFE206 — empty Err arms swallow errors
enabled = true
severity = "error"

[rules.unlogged_error_branch] # SAFE207 — Err handled but neither logged nor propagated
enabled = true
severity = "warning"

[rules.dangerous_mem_ops] # SAFE306 — mem::transmute/forget/zeroed/uninitialized
enabled = true
severity = "error"

[rules.undocumented_unsafe] # SAFE602 — unsafe {} without a // SAFETY: comment
enabled = true
severity = "error"

[rules.truncating_as_cast] # SAFE308 — lossy `as` integer/float casts
enabled = true
severity = "warning"

[rules.needless_mut] # SAFE110 — `let mut` never mutated
enabled = true
severity = "warning"

[rules.unchecked_arithmetic_on_input] # SAFE112 — raw +/-/* on integer params
enabled = true
severity = "warning"

[rules.interior_mutable_static] # SAFE307 — global mutable state via interior mutability
enabled = true
severity = "warning"

# ── Cross-language rules that apply to Rust but ship disabled ────────────────────
[rules.blanket_suppression] # SAFE603 — un-scoped #[allow(...)] / suppressions
enabled = true
severity = "error"

[rules.tainted_sink] # SAFE801 — untrusted input into a dangerous sink
enabled = true
severity = "error"

[rules.return_value_ignored] # SAFE802 — discarded return of an error-signalling call
enabled = true
severity = "warning"

[rules.null_dereference] # SAFE803 — use-after-None-check / possible None deref
enabled = true
severity = "error"

# ── Left OFF deliberately ───────────────────────────────────────────────────────
# missing_assertions (SAFE601): heuristic; noisy on declarative/config code.
[rules.missing_assertions]
enabled = false

# test_existence / test_coupling (SAFE701/702): no test suite yet — they would
# fire on every source file. Enable at M0 once tests land.
[rules.test_existence]
enabled = false
test_dirs = ["tests"]
severity = "warning"

[rules.test_coupling]
enabled = false
test_dirs = ["tests"]
severity = "warning"
