# Dependabot keeps Cargo dependencies and GitHub Actions fresh. Grouped weekly
# PRs keep review load low; security bumps still arrive immediately, ungrouped.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Raise bumps against development (the RC branch) so they flow through the
    # development -> main release path and never diverge main from development.
    target-branch: "development"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
