name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (all features)
        run: cargo build --all-features --verbose
      - name: Test (all features)
        run: cargo test --all-features --verbose
      - name: Build (no default features)
        run: cargo build --no-default-features --verbose

  # Runs the exact same checks as the local pre-commit pass: hygiene hooks,
  # SafeLint (Rust rule set), rustfmt, and clippy (-D warnings).
  pre-commit:
    name: pre-commit (safelint + rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
      # pre-commit runs clippy with --all-features; also check the bare feature
      # set, where the engine `cfg` arms compile differently.
      - name: clippy (no default features)
        run: cargo clippy --no-default-features -- -D warnings
